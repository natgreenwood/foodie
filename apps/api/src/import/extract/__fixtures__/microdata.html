<!doctype html>
<html>
  <head>
    <title>Grandma's scones</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Old Recipe Blog"
      }
    </script>
  </head>
  <body>
    <article itemscope itemtype="http://schema.org/Recipe">
      <h1 itemprop="name">Grandma's Scones</h1>
      <div itemprop="author" itemscope itemtype="http://schema.org/Person">
        By <span itemprop="name">Grandma</span>
      </div>
      <meta itemprop="prepTime" content="PT20M" />
      <p>Cook: <time itemprop="cookTime" datetime="PT12M">12 minutes</time></p>
      <p>Makes <span itemprop="recipeYield">12 scones</span></p>
      <meta itemprop="recipeCategory" content="Baking" />
      <meta itemprop="keywords" content="scones, afternoon tea" />
      <h2>Ingredients</h2>
      <ul>
        <li itemprop="recipeIngredient">3 cups self-raising flour</li>
        <li itemprop="recipeIngredient"><span>1 cup</span> cream</li>
        <li itemprop="recipeIngredient">1 cup lemonade</li>
      </ul>
      <h2>Method</h2>
      <div itemprop="recipeInstructions">
        <ol>
          <li>Heat the oven to 220&deg;C.</li>
          <li>Mix the flour, cream and lemonade.<br />Do not overwork it.</li>
          <li>Cut out and bake for 12 minutes.</li>
        </ol>
      </div>
    </article>
  </body>
</html>
