<!doctype html>
<html>
  <head>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Roast chicken",
        "recipeIngredient": ["1 whole chicken", "2 tbsp olive oil"],
        "recipeInstructions": [
          {
            "@type": "HowToSection",
            "name": "Prepare",
            "itemListElement": [
              { "@type": "HowToStep", "text": "Heat the oven to 200C." },
              { "@type": "HowToStep", "text": "Rub the chicken with oil." }
            ]
          },
          {
            "@type": "HowToSection",
            "name": "Roast",
            "itemListElement": [
              { "@type": "HowToStep", "text": "Roast for 1 hour." }
            ]
          },
          { "@type": "HowToStep", "text": "Rest before carving." }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Gravy",
        "recipeIngredient": ["2 tbsp flour"]
      }
    </script>
  </head>
  <body></body>
</html>
