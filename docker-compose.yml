services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    # Apply migrations, then exec the watcher so it (not sh) receives SIGTERM.
    command: sh -c "pnpm db:migrate && exec node_modules/.bin/tsx watch src/server.ts"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foodie}:${POSTGRES_PASSWORD:-foodie}@postgres:5432/${POSTGRES_DB:-foodie}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Hot reload: source and migrations come from the host; node_modules stay in the image.
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/drizzle:/app/apps/api/drizzle
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodie}
      POSTGRES_DB: ${POSTGRES_DB:-foodie}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      # The Vite dev server proxies /api/* here, so the browser needs no CORS.
      API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      # Hot reload: source comes from the host; node_modules stay in the image.
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    depends_on:
      - api

volumes:
  postgres-data:
