name: Secrets scan

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write # gitleaks-action comments on the offending PR lines

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
